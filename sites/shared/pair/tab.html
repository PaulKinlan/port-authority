<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>A tab of one site, connected to its shared worker</title>
<style>
  html{color-scheme:light dark}
  body{margin:0;padding:.7rem .8rem;font:14px/1.4 system-ui,sans-serif;background:light-dark(#fff,#141f47);color:light-dark(#0f1c3f,#e9edfa)}
  h1{font:800 1rem/1.1 system-ui,sans-serif;margin:0 0 .15rem;display:flex;align-items:center;gap:.45rem}
  h1::before{content:"";width:.8em;height:.8em;border-radius:50%;background:var(--dot,#f5b700);flex:none}
  p{margin:0 0 .45rem;font:11px/1.3 ui-monospace,Menlo,monospace;opacity:.75;overflow-wrap:anywhere}
  ul{list-style:none;margin:0;padding:0;font:12px/1.45 ui-monospace,Menlo,monospace}
  li{padding:.15rem 0;border-top:1px solid light-dark(#c9d1e0,#2b3970);overflow-wrap:anywhere}
  li:first-child{border-top:0;font-weight:700}
</style>
<h1 id="title"></h1>
<p id="origin"></p>
<ul id="log"></ul>
<script type="module">
  // Embedded in a diagram on port-authority.dev. The page around it says what to do.
  import { runtime } from "/wire.js";
  const params = new URLSearchParams(location.search);
  const SITE = location.hostname.split(".")[0].replace(/^pa-/, "");
  const NAME = params.get("name") || "a tab";
  document.getElementById("title").textContent = params.get("title") || NAME;
  document.getElementById("title").style.setProperty("--dot", { florist: "#e0364c", library: "#0e9f8e" }[SITE] || "#f5b700");
  document.getElementById("origin").textContent = location.host;
  runtime();
  if (!("SharedWorker" in self)) { log("this browser has no SharedWorker"); tell("up"); }
  else {
    const { port } = new SharedWorker("/pair-shared.js", { name: "pair" });
    let trunk = null, trunkTo = null;
    port.onmessage = ({ data, ports }) => {
      if (data.state) { tell("shared", { state: data.state, note: data.note }); return; }
      if (data.note) { log(`${data.from} of the ${data.site} says: ${data.note}`); tell("heard", { via: data.via }); }
      if (data.carry && trunk) { trunk.postMessage({ carry: true }, [ports[0]]); log(`my shared worker gave me a port. Sent it over my line to the ${trunkTo}'s tab`); tell("pulse", { cable: "trunk" }); }
    };
    port.postMessage({ hello: NAME });
    // Say goodbye when this tab goes, because a shared worker is not told.
    addEventListener("pagehide", () => port.postMessage({ bye: NAME }));
    on("trunk", (data, ports) => {
      trunk = ports[0]; trunkTo = data.to;
      trunk.onmessage = (event) => {
        if (!event.data?.carry) return;
        port.postMessage({ peer: trunkTo }, [event.ports[0]]);
        log(`a port came over my line from the ${trunkTo}'s tab. Gave it to my shared worker`);
      };
      log(`holding a line to the ${data.to}'s tab`);
    });
    on("join", (data) => port.postMessage({ join: true, to: data.to }));
    on("note", (data) => { port.postMessage({ note: data.text }); log(`posted to my shared worker: ${data.text}`); });
    tell("up");
  }
</script>
</html>
