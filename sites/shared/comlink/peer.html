<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peer</title>
<style>
  html { color-scheme: light dark; }
  body { margin: 0; padding: .7rem .8rem; font: 14px/1.4 system-ui, sans-serif; background: light-dark(#fff, #141f47); color: light-dark(#0f1c3f, #e9edfa); }
  h1 { font: 800 1rem/1.1 "Arial Narrow", system-ui, sans-serif; margin: 0 0 .1rem; display: flex; align-items: center; gap: .45rem; }
  h1::before { content: ""; width: .8em; height: .8em; border-radius: 50%; background: var(--dot, #f5b700); }
  p { margin: 0 0 .4rem; font-size: 11px; opacity: .7; overflow-wrap: anywhere; }
  ul { list-style: none; margin: 0; padding: 0; font: 12px/1.45 ui-monospace, Menlo, monospace; }
  li { padding: .15rem 0; border-top: 1px solid light-dark(#c9d1e0, #2b3970); overflow-wrap: anywhere; }
  li:first-child { border-top: 0; font-weight: 700; }
</style>
<h1 id="title">Peer</h1>
<p id="origin"></p>
<ul id="log"></ul>
<script type="module">
  // The far side of every demo on /comlink/. It is served from each demo
  // origin, takes a port only from the main site, and exposes the same small
  // API through Hawser or through Comlink, whichever the offer asks for.
  import { sites } from "/_sites.js";
  import { expose, wrap, accept } from "/hawser.js";
  import * as Comlink from "/vendor/comlink.mjs";

  const query = new URLSearchParams(location.search);
  const COLORS = { yellow: "#f5b700", red: "#e0364c", teal: "#0e9f8e" };
  document.getElementById("title").textContent = query.get("title") || "Peer";
  document.getElementById("origin").textContent = location.host;
  document.body.style.setProperty("--dot", COLORS[query.get("color")] || COLORS.yellow);
  const logEl = document.getElementById("log");
  const log = (text) => { const li = document.createElement("li"); li.textContent = text; logEl.prepend(li); while (logEl.children.length > 7) logEl.lastChild.remove(); };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function makeApi(mark) {
    class Note { constructor(title) { this.text = title; } title() { return this.text; } }
    class Notebook { constructor(name) { this.name = name; } latest() { return mark(new Note(`Latest note in ${this.name}`)); } }
    class Session {
      constructor(user) { this.user = user; log(`session opened for ${user}`); }
      who() { return this.user; }
      [Symbol.dispose]() { log(`session for ${this.user} closed`); }
    }
    let n = 41, held;
    return {
      async slow(ms) { log(`asked a slow question (${ms / 1000}s)`); await sleep(ms); return "the answer"; },
      async count(to, signal) {
        for (let i = 1; i <= to; i++) {
          if (signal?.aborted) { log(`told to stop at step ${i}`); throw signal.reason; }
          log(`step ${i} of ${to}`);
          await sleep(400);
        }
        return `counted to ${to}`;
      },
      open(name) { return mark(new Notebook(name)); },
      async *ticks() {
        let i = 0;
        try { for (;;) { await sleep(350); log(`made tick ${++i}`); yield i; } }
        finally { log(`generator closed after ${i} ticks`); }
      },
      counter: { read: () => n, add: () => ++n },
      Session,
      fail() { throw new RangeError("the shelf is full", { cause: new Error("disk quota reached") }); },
      // For the frame that plays a guest: it is handed a port and told to try things.
      take(port) { held = wrap(port); log("was handed a port"); },
      async tryRead() { try { const v = await held.read(); log(`read: ${v}`); return `read ${v}`; } catch (e) { log(`read failed: ${e.name}`); return `${e.name}`; } },
      async tryAdd() { try { const v = await held.add(); log(`add: ${v}`); return `added, now ${v}`; } catch (e) { log(`add failed: ${e.name}`); return `${e.name}`; } },
    };
  }

  accept(sites.main, (port, { hello }) => {
    if (hello.lib === "comlink") { Comlink.expose(makeApi(Comlink.proxy), port); log("exposed with Comlink"); }
    else { expose(makeApi((object) => object), port, { onclose: () => log("link closed") }); log("exposed with Hawser"); }
  });
  parent.postMessage({ peer: "ready" }, sites.main);
</script>
