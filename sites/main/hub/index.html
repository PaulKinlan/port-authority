<html lang="en">
<head>

  <link rel="stylesheet" href="/base.css">

</head>
<body>
  <div class="wrap">
    <header class="site-bar">
      <a class="wordmark" href="/">Port Authority</a>
      <nav><a href="/">About</a><a href="/patterns/">Port patterns</a><a href="/hub/" aria-current="page">Your hub</a></nav>
    </header>
    <div class="stack" style="--gap:.8rem; padding-top:2rem">
      <h1 style="font-size:var(--step-3)">Your hub</h1>
      <p>You do not need to keep this open. Your hub lives on a server and remembers which sites offer you which tools. This page is only for looking at it and changing it. Calls between two sites happen on your machine and never pass through here.</p>
    </div>
    <main class="dash" id="dash"></main>
  </div>
  <script type="module">
    import { switchboard, mountDashboard } from "/hub/ui.js";
    mountDashboard(document.getElementById("dash"), switchboard());
  </script>
