<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A port pattern | Port Authority</title>
  <meta name="description" content="One thing you can do with a MessagePort, running live, with how it works, what to build with it and what goes wrong.">
  <meta property="og:title" content="A port pattern | Port Authority">
  <meta property="og:description" content="One thing you can do with a MessagePort, running live, with how it works, what to build with it and what goes wrong.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/base.css">
  <script src="/nav.js"></script>
  <link rel="stylesheet" href="/patterns/patterns.css">
  <script src="/errors.js"></script>
  <style>
    .crumb { font-size: var(--step--1); margin: 0; }
    .deep { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(2rem, 5vw, 3rem); padding-block: 1rem 3rem; }
    .deep section > h2 { font-size: var(--step-1); margin-bottom: .7rem; }
    .deep p, .deep li { max-width: 68ch; }
    .deep ul, .deep ol { padding-left: 1.2rem; display: grid; gap: .5rem; margin: 0; }
    .deep pre { margin: 0; overflow-x: auto; }
    .built { border: 2px solid var(--ink); border-radius: 18px; padding: clamp(.8rem, 3vw, 1.4rem); margin-top: 1.2rem; display: grid; gap: .9rem; grid-template-columns: minmax(0, 1fr); background: color-mix(in srgb, var(--yellow) 10%, var(--paper)); }
    .flow { margin: 0 0 1.2rem; max-width: 34rem; }
    .flow svg { width: 100%; height: auto; display: block; }
    .flow figcaption { font-size: var(--step--1, .85rem); color: var(--muted); margin-top: .4rem; }
    .built h3 { font-size: var(--step-1); }
    .built .idea { margin: 0; }
    .built h4 { font: 800 var(--step-0)/1.2 var(--display); margin: .5rem 0 -.3rem; }
    .deep h3.todo { font-size: var(--step-0); margin: 1.4rem 0 .6rem; }
    .measured { border-left: 5px solid var(--teal); padding: .2rem 0 .2rem .9rem; }
    .cards { list-style: none; padding: 0 !important; display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .8rem; }
    .cards a { display: block; height: 100%; border: 2px solid var(--ink); border-radius: 14px; padding: .8rem .9rem; text-decoration: none; background: var(--panel); }
    .cards a:hover { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
    .cards strong { display: block; font: 800 1rem/1.15 var(--display); margin-bottom: .3rem; }
    .cards span { font-size: var(--step--1); color: var(--muted); }
    .pager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; border-top: 2px solid var(--ink); padding-block: 1.2rem 3rem; }
    .pager a { max-width: 22rem; }
    .pager .pager-all { text-align: center; font-weight: 700; white-space: nowrap; }
    .pager .pager-next { justify-self: end; text-align: right; }
    .pager small { display: block; color: var(--muted); }
    @media (max-width: 36rem) {
      .pager { grid-template-columns: 1fr; text-align: left; }
      .pager .pager-all { text-align: left; }
      .pager .pager-next { justify-self: start; text-align: left; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrap">
    <header class="site-bar">
      <a class="wordmark" href="/">Port Authority</a>
      <nav aria-label="Primary"><a href="/">Experiments</a><a href="/guide/">The guide</a><a href="/patterns/" aria-current="page">Port patterns</a><a href="/comlink/">Comlink today</a><a href="/ai-router/">AI router</a><a href="/lab/">The lab</a><a href="/missing/">What is missing</a><a href="/reading/">Further reading</a><a href="/hub/">Your hub</a></nav>
    </header>
    <main id="main">
      <div class="stack" style="padding-block:2rem 1rem; --gap:.6rem">
        <p class="crumb"><a href="/patterns/">Port patterns</a> / <span id="group"></span></p>
        <h1 style="font-size:var(--step-2)" id="title">Loading</h1>
      </div>
      <section class="pattern" id="demo" style="border-top:0; padding-top:0"><div class="demo"></div></section>
      <div class="deep" id="deep"></div>
      <nav class="pager" id="pager" aria-label="More patterns"></nav>
    </main>
    <footer class="small muted" style="padding-block:2rem 4rem">Port Authority, by <a href="https://paul.kinlan.me">Paul Kinlan</a>. <a href="/about/">About this site</a>.</footer>
  </div>
  <script type="module">
    import { mount, TOURS } from "/patterns/demos.js";
    import { all, plain } from "/patterns/all.js";
    import { deep } from "/patterns/deep.js";
    import { built, shown } from "/patterns/built.js";

    const id = location.pathname.split("/").filter(Boolean)[1];
    const index = all.findIndex((d) => d.id === id);
    const $ = (name) => document.getElementById(name);
    if (index < 0) {
      $("title").textContent = "There is no pattern here";
      $("deep").innerHTML = `<p>Nothing is called "${plain(String(id))}". <a href="/patterns/">See all the patterns.</a></p>`;
      $("demo").remove();
    } else {
      const demo = all[index], more = deep[id] || {};
      const byId = (other) => all.find((d) => d.id === other);
      const pageTitle = `${plain(demo.title)} | Port Authority`;
      const pageDesc = plain(demo.blurb).slice(0, 180);
      document.title = pageTitle;
      document.querySelector('meta[name="description"]').content = pageDesc;
      document.querySelector('meta[property="og:title"]').content = pageTitle;
      document.querySelector('meta[property="og:description"]').content = pageDesc;
      $("group").innerHTML = `<a href="/patterns/#${demo.id}">${demo.group.title}</a>`;
      $("title").textContent = demo.title;
      // First the thing itself, running. Then what it is, the code, and how it works.
      mount($("demo").querySelector(".demo"), demo, TOURS, { autoplay: true });

      const list = (items, tag = "ul") => `<${tag}>${items.map((item) => `<li>${item}</li>`).join("")}</${tag}>`;
      const steps = (demo.tour || TOURS[id] || { steps: [] }).steps;
      // A demo built for another pattern can also be what an idea on this page asks for.
      const mine = built.filter((b) => b.pattern === id || b.also?.[id]).map((b) => (b.pattern === id ? b : { ...b, use: b.also[id] }));
      const parts = [];
      parts.push(`<section id="what"><h2>What you are looking at</h2><p>${demo.blurb}</p></section>`);
      parts.push(`<section id="code"><h2>The code</h2><pre>${demo.code}</pre></section>`);
      if (more.how) parts.push(`<section id="how"><h2>How it works</h2>${more.diagram || ""}<div class="stack" style="--gap:.9rem">${more.how.map((p) => `<p>${p}</p>`).join("")}</div></section>`);
      if (steps.length) parts.push(`<section id="steps"><h2>Step by step</h2><p style="margin-bottom:.7rem">What each press of Next does in the demo at the top.</p>${list(steps.map(([label, text]) => `<strong>${label}.</strong> ${text}`), "ol")}</section>`);
      if (more.uses) {
        const covered = new Set(mine.flatMap((b) => b.use));
        const seen = more.uses.map((text, i) => [text, shown[`${id}:${i}`]]).filter(([, where], i) => where && !covered.has(i));
        const todo = more.uses.filter((_, i) => !covered.has(i) && !shown[`${id}:${i}`]);
        parts.push(`<section id="uses"><h2>What you could build with it</h2>${mine.length ? `<p>${mine.length === 1 ? "This one is built and running below." : "These are built and running below."}</p>` : ""}
          ${mine.map((b) => `<article class="built" id="${b.id}"><h3>${b.title}</h3><p class="small muted idea">The idea: ${b.use.map((i) => more.uses[i]).join(" ")}</p><div class="demo"></div><h4>What you are looking at</h4><p>${b.blurb}</p><h4>The code</h4><pre>${b.code}</pre>${b.how ? `<h4>How it works</h4><div class="stack" style="--gap:.9rem">${b.how.map((p) => `<p>${p}</p>`).join("")}</div>` : ""}${b.tour?.steps.length ? `<h4>Step by step</h4><p>What each press of Next does in this demo.</p>${list(b.tour.steps.map(([label, text]) => `<strong>${label}.</strong> ${text}`), "ol")}` : ""}</article>`).join("")}
          ${seen.length ? `<h3 class="todo">Already running</h3>${list(seen.map(([text, [href, label]]) => `${text} <a href="${href}">See ${label}.</a>`))}` : ""}
          ${todo.length ? `<h3 class="todo">Not built yet</h3>${list(todo)}` : ""}</section>`);
      }
      if (more.tryIt) parts.push(`<section id="try"><h2>Things to try</h2>${list(more.tryIt)}</section>`);
      if (more.traps) parts.push(`<section id="traps"><h2>Common mistakes</h2>${list(more.traps)}</section>`);
      if (more.measured) parts.push(`<section id="measured"><h2>Measured</h2><p class="measured">${more.measured} Other browsers are being filled in from <a href="/lab/results/">the lab's results</a>.</p></section>`);
      const related = (more.related || []).map(byId).filter(Boolean);
      if (related.length) parts.push(`<section id="related"><h2>Read next</h2><ul class="cards">${related.map((d) => `<li><a href="/patterns/${d.id}/"><strong>${d.title}</strong><span>${plain(d.blurb).split(". ")[0]}.</span></a></li>`).join("")}</ul></section>`);
      $("deep").innerHTML = parts.join("");
      // The built ideas are demos too. Each is set up when any part of its article is about to be seen.
      for (const b of mine) {
        const el = document.querySelector(`#${b.id} .demo`);
        new IntersectionObserver((entries, io) => { if (entries[0].isIntersecting) { io.disconnect(); mount(el, b); } }, { rootMargin: "300px" }).observe(el.closest("article"));
      }

      const prev = all[index - 1], next = all[index + 1];
      $("pager").innerHTML = `${prev ? `<a href="/patterns/${prev.id}/"><small>\u2039 Before this</small>${prev.title}</a>` : "<span></span>"}<a class="pager-all" href="/patterns/">All patterns</a>${next ? `<a class="pager-next" href="/patterns/${next.id}/"><small>After this \u203a</small>${next.title}</a>` : "<span></span>"}`;
    }
  </script>
  <script type="module" src="/refs.js"></script>
</body>
</html>
